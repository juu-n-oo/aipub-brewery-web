server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Vite hashed assets — long-term cache
    location /dockerizer/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — sub path
    location /dockerizer {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /healthz {
        access_log off;
        return 200 "ok";
    }
}
