server {
    listen       80;
    server_name  _;

    # Vite hashed assets — long-term cache
    location /imagekit/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — sub path
    location /imagekit/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /imagekit/index.html;
    }

    # /imagekit (trailing slash 없이 접근 시)
    location = /imagekit {
        return 301 /imagekit/;
    }

    # Health check
    location /healthz {
        access_log off;
        return 200 "ok";
    }
}
